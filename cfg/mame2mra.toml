# Declarative MRA input for the two supported Escape Kids sets.
# Syntax follows the pinned JTCORES mame2mra.toml convention.

[global]
author = ["meathax"]

[parse]
sourcefile = ["vendetta.cpp"]
debug = { machine = "esckids" }
main_setnames = ["esckids", "esckidsj"]

[buttons]
names = [
    { names = "Run,Super Jump,Auto Run", machine = "esckids" },
    { names = "Run,Super Jump,Auto Run", machine = "esckidsj" },
]

# MAME's Escape Kids driver has no DIP-switch block.  The target therefore
# intentionally emits no DIP menu; this delete keeps generic Unknown/Unused
# fields out if a future parser exposes them through the shared driver.
[dipsw]
delete = [{ names = ["Unused", "Unknown"] }]

[header]
info = """Header to identify the Escape Kids GX975 cabinet profile.
        Byte 0 = 03 - Escape Kids
        Byte 1 = 00 - Asia, four-player cabinet
        Byte 1 = 01 - Japan, two-player cabinet"""
data = [
    { machine = "esckids",  offset = 0, data = "03 00 00 00" },
    { machine = "esckidsj", offset = 0, data = "03 01 00 00" },
]

[ROM]
regions = [
    { name = "maincpu" },
    { name = "audiocpu", start = "JTFRAME_BA1_START" },
    { name = "k053260", start = "PCM_START", rename = "pcm" },
    { name = "k052109", start = "JTFRAME_BA2_START", width = 32, rename = "tiles" },
    { name = "k053246", start = "JTFRAME_BA3_START", width = 64, rename = "obj" },
    { name = "eeprom", skip = true },
    { name = "plds", skip = true },
]
order = ["maincpu", "audiocpu", "pcm", "tiles", "obj"]
